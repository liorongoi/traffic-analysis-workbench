[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficwb"
version = "0.2.8"
description = "Offline road-traffic image and video analysis (foundations)"
requires-python = ">=3.11"
# tzdata ships the IANA database so zoneinfo works on Windows without network access.
dependencies = [
    "tzdata>=2024.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "starlette>=0.39",   # byte-range responses for video playback
    "av>=12",            # FFmpeg libraries for video decoding and clips
    "uvicorn>=0.29",
    "watchdog>=4.0",       # filesystem notifications, with periodic reconciliation as the fallback
    "psutil>=5.9",          # non-blocking process/system resource figures in the progress UI
    "openvino>=2025.3",     # runs SAM 3.1 (open-vocabulary detection and segmentation) on the CPU
    "tokenizers>=0.20",     # SAM 3.1's text prompts (CLIP tokenizer)
    "tifffile>=2023.1",     # map coordinates of GeoTIFF orthophotos (geo-registration); OpenCV reads the pixels
]

[project.optional-dependencies]
# Exactly one ONNX Runtime build: CPU, NVIDIA CUDA (with its CUDA and cuDNN libraries), or DirectML.
cpu = ["onnxruntime>=1.17"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
directml = ["onnxruntime-directml>=1.17"]
probe = []
dev = ["pytest>=8", "httpx>=0.27", "onnx>=1.16"]   # onnx builds the small SAM 3.1 stand-in for the tests
# Training the vehicle detector (from the learning page, or trafficwb-train). Combine with one ONNX Runtime extra
# (cpu, cuda or directml), which also checks the exported model.
# RF-DETR's own training loop (rfdetr_train.py) comes with the rfdetr package; pinned to the minor version tested, as
# LanePulse adds its progress and stop callback to that loop. transformers and scipy: D-FINE and RT-DETRv2 training
# (detr_train.py); both run offline, from shipped weights.
train = ["torch>=2.3", "onnx>=1.16", "rfdetr[train]>=1.12.1,<1.13", "transformers>=4.53", "scipy>=1.11",
         "safetensors>=0.4"]
# Benchmarks on public datasets (scripts/benchmark.py): COCO-style scoring and TrackEval (HOTA, MOTA, IDF1).
bench = ["pycocotools>=2.0.7", "trackeval>=1.3"]

[project.scripts]
trafficwb-probe = "trafficwb.probe:main"
trafficwb-inventory = "trafficwb.inventory:main"
trafficwb-mission = "trafficwb.cli:main"
trafficwb-web = "trafficwb.web.app:main"
trafficwb-admin = "trafficwb.admin:main"
trafficwb-speedcheck = "trafficwb.speedcheck:main"
trafficwb-models = "trafficwb.model_import:main"
trafficwb-train = "trafficwb.train:main"
trafficwb-worker = "trafficwb.workers:main"
trafficwb-georeg = "trafficwb.georeg:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trafficwb" = ["detector_grades.json", "scene_prompts.json"]
"trafficwb.web" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
