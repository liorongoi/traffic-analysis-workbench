[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficwb"
version = "0.0.1"
description = "Offline road-traffic image and video analysis (foundations)"
requires-python = ">=3.11"
# tzdata ships the IANA database so zoneinfo works on Windows without network access.
dependencies = [
    "tzdata>=2024.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
probe = ["psutil>=5.9"]
dev = ["pytest>=8"]

[project.scripts]
trafficwb-probe = "trafficwb.probe:main"
trafficwb-inventory = "trafficwb.inventory:main"
trafficwb-mission = "trafficwb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
