name: windows-installer
# Builds the offline Windows package (app, dependencies, model packs, Python installer) and the setup wizard
# made from it (Lanemark-Setup-<version>.exe), tries the wizard silently, and publishes only
# that single setup executable. The unpacked bundle is an internal build input.
on:
  push:
    branches: [main, "claude/**", "codex/**"]
  workflow_dispatch:
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - run: python scripts/fetch_models.py
      - run: python scripts/make_bundle.py --platform win_amd64 --python 3.12 --ort auto --out dist
      - name: Add the Python installer (per-user install, no administrator rights)
        id: py
        shell: pwsh
        run: |
          $b = Get-ChildItem dist -Directory | Select-Object -First 1
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" -OutFile "$($b.FullName)\python-3.12.10-amd64.exe"
          "folder=$($b.Name)" >> $env:GITHUB_OUTPUT
          "version=$((Get-Content "$($b.FullName)\bundle.json" -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Build the setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DBundleDir=$PWD\dist\${{ steps.py.outputs.folder }}" "/DAppVersion=${{ steps.py.outputs.version }}" "/DOutDir=$PWD\setup" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem setup | Format-Table Name, Length
      - name: Try the wizard (silent install, server answers, uninstall)
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          $exe = (Get-ChildItem setup -Filter *.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\TrafficWorkbench"
          # Keep a bounded wait so a slow install fails with diagnostics instead of hanging the job.
          $p = Start-Process -PassThru $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$env:RUNNER_TEMP\setup.log"
          $done = $p.WaitForExit(15 * 60 * 1000)
          Get-Content "$dir\logs\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
          if (-not $done) { Get-Content "$env:RUNNER_TEMP\setup.log" | Select-Object -Last 40; throw "setup did not finish in 15 minutes" }
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" | Select-Object -Last 40; throw "setup exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\current.txt")) { throw "the wizard did not install the app" }
          $firstBuild = (Get-Content "$dir\current.txt" -Raw).Trim()
          $wc = New-Object System.Net.WebClient; $wc.Proxy = $null
          # The wizard is configured for manual start; exercise the installed start command explicitly.
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$dir\start.cmd`"" -WorkingDirectory $dir -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            try { $null = $wc.DownloadString("http://127.0.0.1:8765/api/session"); $ready = $true }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { Get-Content "$dir\logs\server.log" -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "installed server did not answer after manual start" }
          Write-Host "Installed server answers after manual start."
          # A second run of the same installer must repair in place without deleting the old build/data.
          & "$dir\autostart.ps1" -Mode remove
          $again = Start-Process -PassThru $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$env:RUNNER_TEMP\setup-reinstall.log"
          if (-not $again.WaitForExit(15 * 60 * 1000)) { throw "same-version reinstall did not finish" }
          if ($again.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-reinstall.log" | Select-Object -Last 40; throw "same-version reinstall exit code $($again.ExitCode)" }
          $secondBuild = (Get-Content "$dir\current.txt" -Raw).Trim()
          if ($secondBuild -eq $firstBuild -or -not (Test-Path $firstBuild)) { throw "same-version repair replaced or lost the prior build" }
          if (-not (Test-Path "$env:USERPROFILE\TrafficData")) { throw "same-version repair removed mission data" }
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$dir\start.cmd`"" -WorkingDirectory $dir -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            try { $null = $wc.DownloadString("http://127.0.0.1:8765/api/session"); $ready = $true }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { Get-Content "$dir\logs\server.log" -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "reinstalled server did not answer after manual start" }
          Write-Host "Same-version repair kept the prior build and data; the new server answers."
          # The uninstaller hands over to a copy of itself in TEMP and exits; wait for that copy too.
          $u = Start-Process -PassThru "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES"
          $null = $u.WaitForExit(5 * 60 * 1000)
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\current.txt"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$dir\current.txt") { throw "uninstall left the program" }
          if (-not (Test-Path "$env:USERPROFILE\TrafficData")) { throw "uninstall removed the data folder" }
          Write-Host "Uninstall removed the program and kept the data."
      - uses: actions/upload-artifact@v4
        with:
          name: Lanemark-Setup-${{ steps.py.outputs.version }}
          path: setup/*.exe
          compression-level: 0
          retention-days: 90
