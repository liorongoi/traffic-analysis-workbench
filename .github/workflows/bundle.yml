name: windows-installer
# Builds the offline Windows package (app, dependencies, model packs, Python installer) and the setup wizard
# made from it (Lanemark-Setup-<version>.exe), tries the wizard silently, and keeps both as
# downloadable artifacts: Actions > windows-installer > latest run > Artifacts.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - run: python scripts/fetch_models.py
      - run: python scripts/make_bundle.py --platform win_amd64 --python 3.12 --ort auto --out dist
      - name: Add the Python installer (per-user install, no administrator rights)
        id: py
        shell: pwsh
        run: |
          $b = Get-ChildItem dist -Directory | Select-Object -First 1
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" -OutFile "$($b.FullName)\python-3.12.10-amd64.exe"
          "folder=$($b.Name)" >> $env:GITHUB_OUTPUT
          "version=$((Get-Content "$($b.FullName)\bundle.json" -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Build the setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DBundleDir=$PWD\dist\${{ steps.py.outputs.folder }}" "/DAppVersion=${{ steps.py.outputs.version }}" "/DOutDir=$PWD\setup" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem setup | Format-Table Name, Length
      - name: Try the wizard (install, repair, uninstall, install again, uninstall) with the bundled Python
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          # As on a workstation without Python: hide the runner's Python so the wizard installs the bundled one.
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python" }) -join ";"
          foreach ($f in "py.exe", "pyw.exe") { if (Test-Path "C:\Windows\$f") { Rename-Item "C:\Windows\$f" "$f.hidden" } }
          $exe = (Get-ChildItem setup -Filter *.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\TrafficWorkbench"
          $link = Join-Path ([Environment]::GetFolderPath("Startup")) "Traffic Analysis Workbench.lnk"
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Lanemark.lnk"
          function Install-Wizard([string]$what) {
            # Not Start-Process -Wait: PowerShell 7 would also wait for the server the wizard leaves running.
            $p = Start-Process -PassThru $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$env:RUNNER_TEMP\setup-$what.log"
            $done = $p.WaitForExit(15 * 60 * 1000)
            Get-Content "$dir\logs\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            if (-not $done) { Get-Content "$env:RUNNER_TEMP\setup-$what.log" | Select-Object -Last 40; throw "$what did not finish in 15 minutes" }
            if (-not (Test-Path "$dir\current.txt")) { throw "$what did not install the app" }
            $wc = New-Object System.Net.WebClient; $wc.Proxy = $null
            for ($i = 0; $i -lt 60; $i++) { try { $null = $wc.DownloadString("http://127.0.0.1:8765/api/session"); break } catch { Start-Sleep -Seconds 2 } }
            $sess = $wc.DownloadString("http://127.0.0.1:8765/api/session") | ConvertFrom-Json
            if (-not $sess.signed_in) { throw "$($what): Lanemark asks for a password on this computer" }
            if (-not (Test-Path $link)) { throw "$what did not set up the sign-in start" }
            if (-not (Test-Path $menu)) { throw "$what did not add the Start menu entry" }
            if (-not (Test-Path "$dir\reset-password.cmd")) { throw "$what did not write reset-password.cmd" }
            if (-not (Test-Path "$dir\import-model.cmd")) { throw "$what did not write import-model.cmd" }
            $env:TWB_MODELS = "$dir\models"
            & "$((Get-Content "$dir\current.txt" -Raw).Trim())\Scripts\trafficwb-models.exe" list
            if ($LASTEXITCODE -ne 0) { throw "$($what): trafficwb-models does not run" }
            if (-not (Test-Path "$dir\python312\python.exe")) { throw "$what did not use the bundled Python" }
            & "$((Get-Content "$dir\current.txt" -Raw).Trim())\Scripts\trafficwb-admin.exe" accounts --data "$env:USERPROFILE\TrafficData"
            Write-Host "$what OK: server answering, shortcuts and bundled Python in place."
          }
          function Uninstall-Wizard {
            # The uninstaller hands over to a copy of itself in TEMP and exits; wait for the files to go.
            $u = Start-Process -PassThru "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES"
            $null = $u.WaitForExit(5 * 60 * 1000)
            for ($i = 0; $i -lt 90 -and ((Test-Path "$dir\current.txt") -or (Test-Path "$dir\python312")); $i++) { Start-Sleep -Seconds 2 }
            if (Test-Path $link) { throw "uninstall left the sign-in start" }
            if (Test-Path "$dir\current.txt") { throw "uninstall left the program" }
            if (Test-Path "$dir\python312") { throw "uninstall left the bundled Python" }
            if (Get-ChildItem "$dir\app-*" -ErrorAction SilentlyContinue) { throw "uninstall left an app folder" }
            if (-not (Test-Path "$env:USERPROFILE\TrafficData")) { throw "uninstall removed the data folder" }
            Write-Host "Uninstall removed the program and kept the data."
          }
          Install-Wizard "install"
          Install-Wizard "repair"             # the same version again over itself
          Uninstall-Wizard
          Install-Wizard "reinstall"          # after an uninstall, with the data kept
          Uninstall-Wizard
      - uses: actions/upload-artifact@v4
        with:
          name: Lanemark-${{ steps.py.outputs.folder }}
          path: dist/${{ steps.py.outputs.folder }}
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Lanemark-Setup-${{ steps.py.outputs.version }}
          path: setup/*.exe
          compression-level: 0
          retention-days: 90

  training-kit:
    # The kit for training the vehicle detector on an Apple-silicon Mac or an NVIDIA computer: the LanePulse wheel,
    # the two setup scripts and TRAINING.txt. Tried here on an Apple-silicon runner (its GPU is not available to
    # virtual machines, so training runs on the CPU in this check).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the kit
        id: kit
        run: |
          python -m pip wheel . --no-deps -w kit
          cp packaging/training/TRAINING.txt packaging/training/setup-training-mac.sh packaging/training/setup-training-windows.ps1 kit/
          echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          ls -l kit
      - name: Set up training from the kit, as on a Mac
        env:
          LANEPULSE_TRAINING: ${{ runner.temp }}/LanePulse-training
        run: |
          bash kit/setup-training-mac.sh
          test -x "$LANEPULSE_TRAINING/Train LanePulse.command"
          "$LANEPULSE_TRAINING/venv/bin/python" -m pip install --quiet pytest
          "$LANEPULSE_TRAINING/venv/bin/python" -m pytest -q tests/test_train.py -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: LanePulse-training-kit-${{ steps.kit.outputs.version }}
          path: kit
          retention-days: 90
