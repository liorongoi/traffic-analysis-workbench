name: windows-installer
# Builds the offline Windows package (app, dependencies, model packs, Python installer) and the setup wizard
# made from it (LanePulse-Setup-<version>.exe), tries the wizard silently, and publishes only
# that single setup executable. The unpacked bundle is an internal build input.
on:
  push:
    branches: [main, "claude/**", "codex/**"]
  workflow_dispatch:
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - run: python scripts/fetch_models.py
      - run: python scripts/make_bundle.py --platform win_amd64 --python 3.12 --ort auto --out dist
      - name: Add the Python installer (per-user install, no administrator rights)
        id: py
        shell: pwsh
        run: |
          $b = Get-ChildItem dist -Directory | Select-Object -First 1
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" -OutFile "$($b.FullName)\python-3.12.10-amd64.exe"
          "folder=$($b.Name)" >> $env:GITHUB_OUTPUT
          "version=$((Get-Content "$($b.FullName)\bundle.json" -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Build the setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DBundleDir=$PWD\dist\${{ steps.py.outputs.folder }}" "/DAppVersion=${{ steps.py.outputs.version }}" "/DOutDir=$PWD\setup" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem setup | Format-Table Name, Length
      - name: Try the wizard (install, repair, uninstall, install again, uninstall) with the bundled Python
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          # As on a workstation without Python: hide the runner's Python so the wizard installs the bundled one.
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python" }) -join ";"
          foreach ($f in "py.exe", "pyw.exe") { if (Test-Path "C:\Windows\$f") { Rename-Item "C:\Windows\$f" "$f.hidden" } }
          $exe = (Get-ChildItem setup -Filter *.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\TrafficWorkbench"
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "LanePulse.lnk"
          $wc = New-Object System.Net.WebClient; $wc.Proxy = $null
          function Wait-Server([string]$what) {
            for ($i = 0; $i -lt 60; $i++) { try { $null = $wc.DownloadString("http://127.0.0.1:8765/api/health"); return } catch { Start-Sleep -Seconds 2 } }
            Get-Content "$dir\logs\server.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "$($what): the installed server did not answer"
          }
          function Install-Wizard([string]$what) {
            # Not Start-Process -Wait: PowerShell 7 would also wait for a server left running.
            $p = Start-Process -PassThru $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$env:RUNNER_TEMP\setup-$what.log"
            $done = $p.WaitForExit(15 * 60 * 1000)
            Get-Content "$dir\logs\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            if (-not $done) { Get-Content "$env:RUNNER_TEMP\setup-$what.log" | Select-Object -Last 40; throw "$what did not finish in 15 minutes" }
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-$what.log" | Select-Object -Last 40; throw "$what exit code $($p.ExitCode)" }
            if (-not (Test-Path "$dir\current.txt")) { throw "$what did not install the app" }
            if (-not (Test-Path $menu)) { throw "$what did not add the Start menu entry" }
            if (-not (Test-Path "$dir\import-model.cmd")) { throw "$what did not write import-model.cmd" }
            $env:TWB_MODELS = "$dir\models"
            & "$((Get-Content "$dir\current.txt" -Raw).Trim())\Scripts\trafficwb-models.exe" list | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "$($what): trafficwb-models does not run" }
            if (-not (Test-Path "$dir\python312\python.exe")) { throw "$what did not use the bundled Python" }
            # Manual start, as the Start menu entry does it.
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$dir\start.cmd`"" -WorkingDirectory $dir -WindowStyle Hidden
            Wait-Server $what
            Write-Host "$what OK: server answering, Start menu entry and bundled Python in place."
            return (Get-Content "$dir\current.txt" -Raw).Trim()
          }
          function Uninstall-Wizard {
            # The uninstaller hands over to a copy of itself in TEMP and exits; wait for the files to go.
            $u = Start-Process -PassThru "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES"
            $null = $u.WaitForExit(5 * 60 * 1000)
            for ($i = 0; $i -lt 90 -and ((Test-Path "$dir\current.txt") -or (Test-Path "$dir\python312")); $i++) { Start-Sleep -Seconds 2 }
            if (Test-Path "$dir\current.txt") { throw "uninstall left the program" }
            if (Test-Path "$dir\python312") { throw "uninstall left the bundled Python" }
            if (Get-ChildItem "$dir\app-*" -ErrorAction SilentlyContinue) { throw "uninstall left an app folder" }
            if (-not (Test-Path "$env:USERPROFILE\TrafficData")) { throw "uninstall removed the data folder" }
            Write-Host "Uninstall removed the program and kept the data."
          }
          $first = Install-Wizard "install"
          & "$dir\autostart.ps1" -Mode remove      # stop the server before running Setup again
          $second = Install-Wizard "repair"         # the same version again: a fresh folder, the old one kept
          if ($second -eq $first -or -not (Test-Path $first)) { throw "same-version repair replaced or lost the prior build" }
          Uninstall-Wizard
          $null = Install-Wizard "reinstall"        # after an uninstall, with the data kept
          Uninstall-Wizard
      - uses: actions/upload-artifact@v4
        with:
          name: LanePulse-Setup-${{ steps.py.outputs.version }}
          path: setup/*.exe
          compression-level: 0
          retention-days: 90

  training-kit:
    # The kit for training the vehicle detector on an Apple-silicon Mac or an NVIDIA computer: the LanePulse wheel,
    # the two setup scripts and TRAINING.txt. Tried here on an Apple-silicon runner (its GPU is not available to
    # virtual machines, so training runs on the CPU in this check).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the kit
        id: kit
        run: |
          python -m pip wheel . --no-deps -w kit
          cp packaging/training/TRAINING.txt packaging/training/setup-training-mac.sh packaging/training/setup-training-windows.ps1 kit/
          echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          ls -l kit
      - name: Set up training from the kit, as on a Mac
        env:
          LANEPULSE_TRAINING: ${{ runner.temp }}/LanePulse-training
        run: |
          bash kit/setup-training-mac.sh
          test -x "$LANEPULSE_TRAINING/Train LanePulse.command"
          "$LANEPULSE_TRAINING/venv/bin/python" -m pip install --quiet pytest
          "$LANEPULSE_TRAINING/venv/bin/python" -m pytest -q tests/test_train.py -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: LanePulse-training-kit-${{ steps.kit.outputs.version }}
          path: kit
          retention-days: 90

  mac-app:
    # LanePulse.app for Apple-silicon Macs, with its own Python, packaged as a .dmg; then tried: offline check,
    # start from the app, stop, start again.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - run: python -m pip install -e .
      - run: python scripts/fetch_models.py
      - name: Python for the app (python-build-standalone, checked against its SHA-256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/20250409/cpython-3.12.10+20250409-aarch64-apple-darwin-install_only.tar.gz"
          echo "2d6477ecd10191675b7e7979e4b9e811fef36833ef3a7f3aa445eec305ce59a2  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c
      - name: Build LanePulse.app and the .dmg
        id: mac
        run: |
          packaging/mac/build_app.sh "$RUNNER_TEMP/python.tar.gz" dist-mac
          echo "version=$(cat dist-mac/LanePulse.app/Contents/Resources/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Try the app from the .dmg (offline check, start, stop, start)
        env:
          LANEPULSE_HOME: ${{ runner.temp }}/LanePulse
          LANEPULSE_NO_BROWSER: "1"
          PIP_NO_INDEX: "1"
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" dist-mac/LanePulse-*.dmg
          cp -R "$RUNNER_TEMP/dmg/LanePulse.app" "$RUNNER_TEMP/LanePulse.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          APP="$RUNNER_TEMP/LanePulse.app"
          codesign --verify --deep "$APP"
          PY="$APP/Contents/Resources/python/bin/python3"
          # Hide the runner's Python so only the app's own is used.
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi python | paste -sd: -)"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$PY" scripts/offline_smoke.py --work "$RUNNER_TEMP/check" --models "$APP/Contents/Resources/models"
          "$APP/Contents/MacOS/LanePulse"
          curl -fsS http://127.0.0.1:8765/api/health
          test -x "$LANEPULSE_HOME/Stop LanePulse.command" && test -x "$LANEPULSE_HOME/Import Model.command"
          ls "$LANEPULSE_HOME/models"
          "$LANEPULSE_HOME/Stop LanePulse.command"
          for i in $(seq 30); do curl -fsS -m 2 http://127.0.0.1:8765/api/health >/dev/null 2>&1 || break; sleep 1; done
          if curl -fsS -m 2 http://127.0.0.1:8765/api/health; then echo "server still running after stop"; exit 1; fi
          "$APP/Contents/MacOS/LanePulse"
          curl -fsS http://127.0.0.1:8765/api/health
          "$LANEPULSE_HOME/Stop LanePulse.command"
          tail -20 "$LANEPULSE_HOME/logs/server.log"
      - uses: actions/upload-artifact@v4
        with:
          name: LanePulse-Mac-${{ steps.mac.outputs.version }}
          path: dist-mac/*.dmg
          compression-level: 0
          retention-days: 90
