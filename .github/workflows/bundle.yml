name: windows-installer
# Builds the offline Windows package (app, dependencies, model packs, Python installer) and the setup wizard
# made from it (LanePulse-Setup-<version>.exe), tries the wizard silently, and publishes only
# that single setup executable. The unpacked bundle is an internal build input.
on:
  push:
    branches: [main, "claude/**", "codex/**"]
  workflow_dispatch:
# actions: read lets each job fetch the previous build from main, to test updating over it.
permissions:
  contents: read
  actions: read
# The install check must also run SAM 3.1 on these machines (on a workstation a SAM 3.1 problem is only reported).
env:
  TWB_REQUIRE_SAM3: "1"
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - run: python scripts/fetch_models.py
      - name: LanePulse's own Python (python-build-standalone, checked against its SHA-256; never registered in Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/astral-sh/python-build-standalone/releases/download/20250409/cpython-3.12.10+20250409-x86_64-pc-windows-msvc-install_only.tar.gz" -OutFile "$env:RUNNER_TEMP\pbs.tar.gz"
          $h = (Get-FileHash "$env:RUNNER_TEMP\pbs.tar.gz" -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "5ac66ae49a2104efeba985c1dc1cb40987757ee81cc6c7f218d10b801f3276ed") { throw "python-build-standalone checksum mismatch: $h" }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\pbs" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\pbs.tar.gz" -C "$env:RUNNER_TEMP\pbs"
      - name: Microsoft C++ runtime to ship (the newest redistributable on the build machine)
        id: vc
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object { [version]($_.Parent.Parent.Name -replace '[^0-9.]', '') } | Select-Object -Last 1
          if (-not $crt) { throw "No Microsoft.VC14x.CRT redistributable found under $vs" }
          $v = [Diagnostics.FileVersionInfo]::GetVersionInfo("$($crt.FullName)\msvcp140.dll").FileVersion
          Write-Host "Shipping $($crt.FullName) (msvcp140.dll $v)"
          Get-ChildItem $crt.FullName | Format-Table Name, Length
          "dir=$($crt.FullName)" >> $env:GITHUB_OUTPUT
      - run: python scripts/make_bundle.py --platform win_amd64 --python 3.12 --ort auto --out dist --with-training --python-runtime "${{ runner.temp }}\pbs\python" --vc-runtime "${{ steps.vc.outputs.dir }}"
      - name: Add the Python installer (per-user install, no administrator rights)
        id: py
        shell: pwsh
        run: |
          $b = Get-ChildItem dist -Directory | Select-Object -First 1
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" -OutFile "$($b.FullName)\python-3.12.10-amd64.exe"
          "folder=$($b.Name)" >> $env:GITHUB_OUTPUT
          "version=$((Get-Content "$($b.FullName)\bundle.json" -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Build the setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DBundleDir=$PWD\dist\${{ steps.py.outputs.folder }}" "/DAppVersion=${{ steps.py.outputs.version }}" "/DOutDir=$PWD\setup" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem setup | Format-Table Name, Length
      - name: The previous build from main, to test updating over it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R "${{ github.repository }}" --workflow bundle.yml --branch main --status success -L 1 --json databaseId -q ".[0].databaseId"
          if (-not $run) { throw "No earlier successful build on main to update from." }
          gh run download $run -R "${{ github.repository }}" -p "LanePulse-Setup-*" -D prev
          Get-ChildItem -Recurse prev | Format-Table FullName, Length
      - name: Try the wizard (update over the previous build, repair, uninstall, install again, uninstall)
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          # As on a workstation without Python: hide the runner's Python so the wizard installs the bundled one.
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python" }) -join ";"
          foreach ($f in "py.exe", "pyw.exe") { if (Test-Path "C:\Windows\$f") { Rename-Item "C:\Windows\$f" "$f.hidden" } }
          $exe = (Get-ChildItem setup -Filter *.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\TrafficWorkbench"
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "LanePulse.lnk"
          $wc = New-Object System.Net.WebClient; $wc.Proxy = $null
          function Wait-Server([string]$what) {
            for ($i = 0; $i -lt 60; $i++) { try { $null = $wc.DownloadString("http://127.0.0.1:8765/api/health"); return } catch { Start-Sleep -Seconds 2 } }
            Get-Content "$dir\logs\server.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "$($what): the installed server did not answer"
          }
          function Install-Wizard([string]$what) {
            # Not Start-Process -Wait: PowerShell 7 would also wait for a server left running.
            $p = Start-Process -PassThru $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$env:RUNNER_TEMP\setup-$what.log"
            $done = $p.WaitForExit(15 * 60 * 1000)
            Get-Content "$dir\logs\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            if (-not $done) { Get-Content "$env:RUNNER_TEMP\setup-$what.log" | Select-Object -Last 40; throw "$what did not finish in 15 minutes" }
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-$what.log" | Select-Object -Last 40; throw "$what exit code $($p.ExitCode)" }
            if (-not (Test-Path "$dir\current.txt")) { throw "$what did not install the app" }
            if (-not (Test-Path $menu)) { throw "$what did not add the Start menu entry" }
            if (-not (Test-Path "$dir\import-model.cmd")) { throw "$what did not write import-model.cmd" }
            $env:TWB_MODELS = "$dir\models"
            & "$((Get-Content "$dir\current.txt" -Raw).Trim())\Scripts\trafficwb-models.exe" list | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "$($what): trafficwb-models does not run" }
            $venv = (Get-Content "$dir\current.txt" -Raw).Trim()
            if (-not (Select-String -Path "$venv\pyvenv.cfg" -Pattern "python-3\.12\.10" -Quiet)) { Get-Content "$venv\pyvenv.cfg"; throw "$what did not use LanePulse's own Python" }
            if (-not (Test-Path "$venv\share\lanepulse\yolox_s.pth")) { throw "$what did not install the training starting weights" }
            & "$venv\Scripts\python.exe" -c "from trafficwb import training_env as t; s = t.status(wait=True); print(s); assert s['state'] == 'ready' and s['coco_weights'], s"
            if ($LASTEXITCODE -ne 0) { throw "$($what): training is not ready" }
            # The Microsoft C++ runtime must be LanePulse's own copy, never C:\Windows\System32's, which is old on
            # some workstations and makes ONNX Runtime fail with "A DLL initialization routine failed".
            $chk = & "$venv\Scripts\python.exe" "$dir\pc_check.py" --training
            $chk | Select-Object -SkipLast 1 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "$($what): pc_check failed" }
            $rt = ($chk | Select-Object -Last 1 | ConvertFrom-Json).cpp_runtime_loaded
            foreach ($n in "msvcp140.dll", "vcruntime140.dll") {
              $path = $rt.$n.path
              if (-not $path -or -not $path.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase)) { throw "$($what): $n was loaded from '$path', not from LanePulse's own copy" }
            }
            # Manual start, as the Start menu entry does it.
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$dir\start.cmd`"" -WorkingDirectory $dir -WindowStyle Hidden
            Wait-Server $what
            $h = $wc.DownloadString("http://127.0.0.1:8765/api/health") | ConvertFrom-Json
            if ($h.version -ne "${{ steps.py.outputs.version }}" -or $h.install -ne (Split-Path -Leaf $venv)) { throw "$($what): the running server is $($h.version) $($h.install), not the installed build" }
            Write-Host "$what OK: server answering, Start menu entry and bundled Python in place."
            return (Get-Content "$dir\current.txt" -Raw).Trim()
          }
          . "$PWD\.github\scripts\uninstall_check.ps1"
          $data = "$env:USERPROFILE\TrafficData"
          function Uninstall-Wizard([string]$keep = "") { Test-Uninstall -Dir $dir -Data $data -KeepModel $keep }
          # The previous build from main, started the way its icon starts it, then this build over it while it runs.
          $old = (Get-ChildItem prev -Recurse -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process -PassThru $old -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$env:RUNNER_TEMP\setup-previous.log"
          if (-not $p.WaitForExit(20 * 60 * 1000) -or $p.ExitCode -ne 0) { Get-Content "$dir\logs\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "the previous build did not install" }
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$dir\start.cmd`"" -WorkingDirectory $dir -WindowStyle Hidden
          Wait-Server "previous build"
          $before = $wc.DownloadString("http://127.0.0.1:8765/api/health")
          Write-Host "Previous build running: $before"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\TrafficData\keep-me" | Out-Null
          $first = Install-Wizard "update"
          if (-not (Test-Path "$env:USERPROFILE\TrafficData\keep-me")) { throw "the update lost the data folder" }
          if (-not (Get-Content "$dir\previous.txt" -ErrorAction SilentlyContinue)) { throw "the update did not keep the previous version for rollback" }
          & "$dir\autostart.ps1" -Mode remove      # stop the server before running Setup again
          $second = Install-Wizard "repair"         # the same version again: a fresh folder, the old one kept
          if ($second -eq $first -or -not (Test-Path $first)) { throw "same-version repair replaced or lost the prior build" }
          # Uninstall with the server running (Install-Wizard started it), set to start at sign-in, and a model trained here.
          & "$dir\autostart.ps1" -Mode remove -Target $dir | Out-Host
          & "$dir\autostart.ps1" -Mode signin -Target $dir | Out-Host   # starts it again through the restart loop
          $model = New-TrainedModel $dir
          Uninstall-Wizard $model
          Remove-Item -Recurse -Force "$dir\trained-models"
          $null = Install-Wizard "reinstall"        # after an uninstall, with the data kept
          Uninstall-Wizard                          # the server is running again here too
      - uses: actions/upload-artifact@v4
        with:
          name: LanePulse-Setup-${{ steps.py.outputs.version }}
          path: setup/*.exe
          compression-level: 0
          retention-days: 90

  bare-windows:
    # The setup wizard on a bare Windows (a Server Core container: no Visual C++ runtime, no Python, no GPU, nothing
    # added), as on a freshly set-up PC. The build machine has all of those, so it cannot show what a PC lacks.
    needs: bundle
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LanePulse-Setup-*
          path: setup
          merge-multiple: true
      - name: Install and run LanePulse on bare Windows
        shell: pwsh
        run: |
          docker pull mcr.microsoft.com/windows/servercore:ltsc2022
          docker run --rm --isolation process -v "${PWD}\setup:C:\setup" -v "${PWD}\.github\scripts:C:\check" `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -NoProfile -ExecutionPolicy Bypass -File C:\check\bare_windows_check.ps1
          if ($LASTEXITCODE -ne 0) { throw "LanePulse did not install or run on bare Windows" }

  windows-failures:
    # What can go wrong while installing on Windows: too little disk space (first install, update, unpacking Setup),
    # Setup stopped part way (first install, and an update while LanePulse runs), files cut short by an interrupted
    # copy; each followed by Setup again, then uninstall. See .github/scripts/windows_failures.ps1.
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LanePulse-Setup-*
          path: setup
          merge-multiple: true
      - name: Install with things going wrong
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          # As on a workstation without Python.
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python" }) -join ";"
          foreach ($f in "py.exe", "pyw.exe") { if (Test-Path "C:\Windows\$f") { Rename-Item "C:\Windows\$f" "$f.hidden" } }
          $exe = (Get-ChildItem setup -Filter *.exe | Select-Object -First 1).FullName
          $ver = $exe -replace '.*LanePulse-Setup-(.+)\.exe$', '$1'
          & .github\scripts\windows_failures.ps1 -Setup $exe -Version $ver

  older-builds:
    # Every earlier build from main whose Setup is still downloadable, for windows-update-from-older.
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.find.outputs.runs }}
      mac: ${{ steps.find.outputs.mac }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list -R "${{ github.repository }}" --workflow bundle.yml --branch main --status success -L 200 --json databaseId -q '.[].databaseId')"
          out="[]"
          for r in $runs; do
            name="$(gh api "repos/${{ github.repository }}/actions/runs/$r/artifacts" --jq '[.artifacts[] | select((.name | test("-Setup-")) and (.expired | not))][0].name // empty')"
            if [ -n "$name" ]; then out="$(echo "$out" | jq -c --arg r "$r" --arg n "$name" '. + [{run: $r, name: $n}]')"; fi
          done
          echo "$out" | jq .
          echo "runs=$out" >> "$GITHUB_OUTPUT"
          # The Mac app: one earlier build of each version still downloadable (the offline .dmg builds and the online ones).
          mac="[]"; seen=" "
          for r in $runs; do
            name="$(gh api "repos/${{ github.repository }}/actions/runs/$r/artifacts" --jq '[.artifacts[] | select((.name | test("^LanePulse-Mac-")) and (.expired | not))][0].name // empty')"
            if [ -n "$name" ] && [ "${seen#* $name }" = "$seen" ]; then
              seen="$seen$name "; mac="$(echo "$mac" | jq -c --arg r "$r" --arg n "$name" '. + [{run: $r, name: $n}]')"
            fi
          done
          echo "$mac" | jq .
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  windows-update-from-older:
    # This build's Setup over each earlier build from main while it runs: data and a model trained there kept, the
    # earlier version kept for rollback, the new one running; then uninstall.
    needs: [bundle, older-builds]
    if: needs.older-builds.outputs.runs != '[]'
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        old: ${{ fromJSON(needs.older-builds.outputs.runs) }}
    name: update from ${{ matrix.old.name }} (run ${{ matrix.old.run }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LanePulse-Setup-*
          path: setup
          merge-multiple: true
      - name: The earlier build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ matrix.old.run }} -R "${{ github.repository }}" -n "${{ matrix.old.name }}" -D old
      - name: Update from it
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          $new = (Get-ChildItem setup -Filter *.exe | Select-Object -First 1).FullName
          $old = (Get-ChildItem old -Recurse -Filter *.exe | Select-Object -First 1).FullName
          $ver = $new -replace '.*LanePulse-Setup-(.+)\.exe$', '$1'
          & .github\scripts\windows_update_from.ps1 -Old $old -New $new -Version $ver

  mac-update-from-older:
    # The new Mac app dragged over each earlier Mac build while it runs, then opened: this version answering, SAM 3.1
    # offered and selectable on the new-mission screen, the data kept, and it starts again offline.
    needs: [mac-app, older-builds]
    if: needs.older-builds.outputs.mac != '[]'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        old: ${{ fromJSON(needs.older-builds.outputs.mac) }}
    name: Mac update from ${{ matrix.old.name }} (run ${{ matrix.old.run }})
    env:
      LANEPULSE_HOME: ${{ github.workspace }}/../LanePulse-home
      LANEPULSE_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: LanePulse-Mac-*
          path: new
          merge-multiple: true
      - name: The earlier build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ matrix.old.run }} -R "${{ github.repository }}" -n "${{ matrix.old.name }}" -D old
      - run: python -m pip install --quiet playwright && python -m playwright install chromium >/dev/null
      - name: Update from it
        run: |
          new="$(ls new/*.dmg | head -1)"; old="$(find old -name '*.dmg' | head -1)"
          ver="$(basename "$new" .dmg)"; ver="${ver#LanePulse-}"
          .github/scripts/mac_update_from.sh "$old" "$new" "$ver"
      - if: always()
        run: tail -40 "$LANEPULSE_HOME/logs/server.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screen-from-${{ matrix.old.run }}
          path: ${{ runner.temp }}/mac-new-mission.png
          if-no-files-found: ignore
          retention-days: 14

  training-kit:
    # The kit for training the vehicle detector on an Apple-silicon Mac or an NVIDIA computer: the LanePulse wheel,
    # the two setup scripts and TRAINING.txt. Tried here on an Apple-silicon runner (its GPU is not available to
    # virtual machines, so training runs on the CPU in this check).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the kit
        id: kit
        run: |
          python -m pip wheel . --no-deps -w kit
          cp packaging/training/TRAINING.txt packaging/training/setup-training-mac.sh packaging/training/setup-training-windows.ps1 kit/
          echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          ls -l kit
      - name: Set up training from the kit, as on a Mac
        env:
          LANEPULSE_TRAINING: ${{ runner.temp }}/LanePulse-training
        run: |
          bash kit/setup-training-mac.sh
          test -x "$LANEPULSE_TRAINING/Train LanePulse.command"
          "$LANEPULSE_TRAINING/venv/bin/python" -m pip install --quiet pytest httpx
          "$LANEPULSE_TRAINING/venv/bin/python" -m pytest -q tests/test_train.py -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: LanePulse-training-kit-${{ steps.kit.outputs.version }}
          path: kit
          retention-days: 90

  mac-app:
    # LanePulse.app for Apple-silicon Macs, an online installer packaged as a small .dmg: the first time it is opened
    # it downloads its own Python, the packages and the models (each pinned to its SHA-256) into ~/LanePulse/runtime.
    # Then tried: update over the previous build from main while it runs, an update with unchanged packages, a clean
    # first install, the offline check with the internet blocked, start, stop, start again offline.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYURL: https://github.com/astral-sh/python-build-standalone/releases/download/20250409/cpython-3.12.10+20250409-aarch64-apple-darwin-install_only.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - name: Python for the app (python-build-standalone, checked against its SHA-256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" "$PYURL"
          echo "2d6477ecd10191675b7e7979e4b9e811fef36833ef3a7f3aa445eec305ce59a2  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c
      - name: Build LanePulse.app and the .dmg
        id: mac
        run: |
          packaging/mac/build_app.sh "$RUNNER_TEMP/python.tar.gz" "$PYURL" dist-mac
          cat dist-mac/LanePulse.app/Contents/Resources/setup/packages.lock | cut -d' ' -f1-3 | sed 's|https://files.pythonhosted.org/packages/[^ ]*/||'
          ls -la dist-mac
          echo "version=$(cat dist-mac/LanePulse.app/Contents/Resources/version.txt)" >> "$GITHUB_OUTPUT"
      - name: The previous build from main, to test updating over it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list -R "${{ github.repository }}" --workflow bundle.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId')"
          test -n "$run" || { echo "No earlier successful build on main to update from."; exit 1; }
          gh run download "$run" -R "${{ github.repository }}" -p "LanePulse-Mac-*" -D prev
          ls -lR prev
      - name: Update over the previous build while it runs (sets up online), then an update with unchanged packages
        env:
          LANEPULSE_HOME: ${{ runner.temp }}/LanePulse
          LANEPULSE_NO_BROWSER: "1"
        run: |
          set -x
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/old" "$(ls prev/*/*.dmg | head -1)"
          cp -R "$RUNNER_TEMP/old/LanePulse.app" "$RUNNER_TEMP/LanePulse.app"
          hdiutil detach "$RUNNER_TEMP/old"
          "$RUNNER_TEMP/LanePulse.app/Contents/MacOS/LanePulse"
          curl -fsS http://127.0.0.1:8765/api/health; echo
          mkdir -p "$LANEPULSE_HOME/data/keep-me"
          # As Finder does when you drag the new app over the old one.
          rm -rf "$RUNNER_TEMP/LanePulse.app"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/new" dist-mac/LanePulse-*.dmg
          cp -R "$RUNNER_TEMP/new/LanePulse.app" "$RUNNER_TEMP/LanePulse.app"
          hdiutil detach "$RUNNER_TEMP/new"
          "$RUNNER_TEMP/LanePulse.app/Contents/MacOS/LanePulse"
          v="$(curl -fsS http://127.0.0.1:8765/api/health | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test "$v" = "${{ steps.mac.outputs.version }}" || { echo "the old server is still running ($v)"; exit 1; }
          test -d "$LANEPULSE_HOME/data/keep-me"
          PY="$LANEPULSE_HOME/runtime/python/bin/python3"
          "$PY" -c "from trafficwb import training_env as t; s = t.status(wait=True); print(s); assert s['state'] == 'ready' and s['coco_weights'], s"
          # A newer build with the same packages: only LanePulse itself is installed again.
          echo "${{ steps.mac.outputs.version }}-next" > "$RUNNER_TEMP/LanePulse.app/Contents/Resources/build.txt"
          "$RUNNER_TEMP/LanePulse.app/Contents/MacOS/LanePulse"
          grep -q "packages it uses are unchanged" "$LANEPULSE_HOME/logs/setup.log"
          test "$(cat "$LANEPULSE_HOME/runtime/.build")" = "${{ steps.mac.outputs.version }}-next"
          test "$(cat "$LANEPULSE_HOME/.server-version")" = "${{ steps.mac.outputs.version }}-next"
          curl -fsS http://127.0.0.1:8765/api/health; echo
          "$LANEPULSE_HOME/Stop LanePulse.command"
          rm -rf "$RUNNER_TEMP/LanePulse.app" "$LANEPULSE_HOME"
      - name: Try the app from the .dmg (clean first install, offline check, start, stop, start offline)
        env:
          LANEPULSE_HOME: ${{ runner.temp }}/LanePulse
          LANEPULSE_NO_BROWSER: "1"
        run: |
          set -x
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" dist-mac/LanePulse-*.dmg
          cp -R "$RUNNER_TEMP/dmg/LanePulse.app" "$RUNNER_TEMP/LanePulse.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          APP="$RUNNER_TEMP/LanePulse.app"
          codesign --verify --deep "$APP"
          # Hide the runner's Python so only the app's own is used.
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi python | paste -sd: -)"
          "$APP/Contents/MacOS/LanePulse"
          curl -fsS http://127.0.0.1:8765/api/health
          "$LANEPULSE_HOME/Stop LanePulse.command"
          PY="$LANEPULSE_HOME/runtime/python/bin/python3"
          ls "$LANEPULSE_HOME/models" "$LANEPULSE_HOME/runtime/python/share/lanepulse"
          export NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$PY" scripts/offline_smoke.py --work "$RUNNER_TEMP/check" --models "$LANEPULSE_HOME/models"
          "$APP/Contents/MacOS/LanePulse"
          curl -fsS http://127.0.0.1:8765/api/health
          # SAM 3.1 is offered by the running app, and can be chosen on the new-mission screen.
          curl -fsS http://127.0.0.1:8765/api/sam3 | "$pythonLocation/bin/python3" -c 'import json,sys; s = json.load(sys.stdin); print({k: s[k] for k in ("installed", "reason", "memory_gb")}); assert s["installed"], s'
          "$pythonLocation/bin/python3" -m pip install --quiet playwright && "$pythonLocation/bin/python3" -m playwright install chromium >/dev/null
          "$pythonLocation/bin/python3" .github/scripts/mac_sam_screen.py http://127.0.0.1:8765 "$RUNNER_TEMP/mac-new-mission.png"
          test -x "$LANEPULSE_HOME/Stop LanePulse.command" && test -x "$LANEPULSE_HOME/Import Model.command"
          grep -q 'runtime/python/bin/python3' "$LANEPULSE_HOME/Import Model.command"
          "$LANEPULSE_HOME/Stop LanePulse.command"
          for i in $(seq 30); do curl -fsS -m 2 http://127.0.0.1:8765/api/health >/dev/null 2>&1 || break; sleep 1; done
          if curl -fsS -m 2 http://127.0.0.1:8765/api/health; then echo "server still running after stop"; exit 1; fi
          # Opened again with the internet blocked: nothing is downloaded, it starts.
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$APP/Contents/MacOS/LanePulse"
          curl -fsS http://127.0.0.1:8765/api/health
          "$LANEPULSE_HOME/Stop LanePulse.command"
          # A server of an older build still running that this app did not record (as the first builds, which had no
          # version in /api/health): opening the app replaces it, so the screens are this build's.
          "$PY" -c '# trafficwb older server stand-in
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  b = json.dumps({"status": "ok"}).encode(); self.send_response(200); self.end_headers(); self.wfile.write(b)
          http.server.HTTPServer(("127.0.0.1", 8765), H).serve_forever()' &
          for i in $(seq 20); do curl -fsS -m 2 http://127.0.0.1:8765/api/health >/dev/null 2>&1 && break; sleep 1; done
          rm -f "$LANEPULSE_HOME/.server.pid"
          "$APP/Contents/MacOS/LanePulse"
          v="$(curl -fsS http://127.0.0.1:8765/api/health | "$pythonLocation/bin/python3" -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))')"
          test "$v" = "${{ steps.mac.outputs.version }}" || { echo "the older server is still the one answering ($v)"; exit 1; }
          "$LANEPULSE_HOME/Stop LanePulse.command"
          tail -20 "$LANEPULSE_HOME/logs/server.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-new-mission-screen
          path: ${{ runner.temp }}/mac-new-mission.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: LanePulse-Mac-${{ steps.mac.outputs.version }}
          path: dist-mac/*.dmg
          compression-level: 0
          retention-days: 90

  linux-server:
    # The LanePulse server package for Ubuntu and Red Hat with NVIDIA GPUs (own Python, PyTorch, CUDA libraries), then
    # tried on a clean Ubuntu runner (no GPU, so it runs on the CPU): install, reach it over the network, restart,
    # repair, roll back, uninstall keeping the data, install again.
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      name: ${{ steps.srv.outputs.name }}
    steps:
      - name: Make room (PyTorch with CUDA is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - run: python -m pip install -e .
      - run: python scripts/fetch_models.py
      - name: Python for the server (python-build-standalone, checked against its SHA-256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/20250409/cpython-3.12.10+20250409-x86_64-unknown-linux-gnu-install_only.tar.gz"
          echo "e9cf6f7da499a4400ba30ae1da8f7ef25ce97827bd8c1084717aa05438035186  $RUNNER_TEMP/python.tar.gz" | sha256sum -c
      - name: Build the server package
        id: srv
        run: |
          packaging/server/build_server.sh "$RUNNER_TEMP/python.tar.gz" dist-server
          name="$(basename dist-server/*.tar.gz .tar.gz)"
          rm -rf "dist-server/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          df -h .
      - name: The previous build from main, to test updating over it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list -R "${{ github.repository }}" --workflow bundle.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId')"
          test -n "$run" || { echo "No earlier successful build on main to update from."; exit 1; }
          gh run download "$run" -R "${{ github.repository }}" -p "lanepulse-server-*" -D "$RUNNER_TEMP/prev"
          ls -lR "$RUNNER_TEMP/prev"
      - name: Try it (install the previous build, update over it, network, restart, repair, rollback, uninstall, install again)
        run: |
          set -x
          IP="$(hostname -I | awk '{print $1}')"
          up() { for i in $(seq 90); do curl -fsS -m 2 "http://$IP:8765/api/health" && return 0; sleep 1; done; sudo tail -40 /opt/lanepulse/logs/server.log; return 1; }
          mkdir -p "$RUNNER_TEMP/old" && tar -xzf "$(ls "$RUNNER_TEMP"/prev/*/*.tar.gz | head -1)" -C "$RUNNER_TEMP/old"
          rm -rf "$RUNNER_TEMP/prev"
          sudo "$(ls -d "$RUNNER_TEMP"/old/*/ | head -1)install-server.sh" --allow-from any --skip-check
          up
          rm -rf "$RUNNER_TEMP/old"
          sudo mkdir -p /srv/lanepulse/data/keep-me
          mkdir -p "$RUNNER_TEMP/pkg" && tar -xzf "dist-server/${{ steps.srv.outputs.name }}.tar.gz" -C "$RUNNER_TEMP/pkg"
          P="$RUNNER_TEMP/pkg/${{ steps.srv.outputs.name }}"
          cat "$P/server.json"
          IP="$(hostname -I | awk '{print $1}')"
          up() { for i in $(seq 90); do curl -fsS -m 2 "http://$IP:8765/api/health" && return 0; sleep 1; done; sudo tail -40 /opt/lanepulse/logs/server.log; return 1; }
          sudo "$P/install-server.sh" --allow-from any
          up
          v="$(curl -fsS "http://$IP:8765/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test "$v" = "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$P/server.json")"
          test -d /srv/lanepulse/data/keep-me
          sudo -u lanepulse /opt/lanepulse/current/python/bin/python3 -c "from trafficwb import training_env as t; s = t.status(wait=True); print(s); assert s['state'] == 'ready' and s['coco_weights'], s"
          lanepulse setup-training
          curl -fsS "http://$IP:8765/" | grep -qi "<html"
          lanepulse status
          lanepulse models
          sudo lanepulse restart && up
          sudo "$P/install-server.sh" --skip-check            # repair: same version again, settings kept
          up
          grep -q 'ALLOW="any"' /etc/lanepulse/lanepulse.conf
          sudo lanepulse rollback && up
          sudo /opt/lanepulse/uninstall-server.sh
          if curl -fsS -m 2 "http://$IP:8765/api/health"; then echo "still running after uninstall"; exit 1; fi
          test -d /srv/lanepulse/data && test -d /srv/lanepulse/models && test ! -e /opt/lanepulse
          sudo "$P/install-server.sh" --allow-from any --skip-check
          up
          sudo /opt/lanepulse/uninstall-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.srv.outputs.name }}
          path: dist-server/*.tar.gz
          compression-level: 0
          retention-days: 90

  rhel-server:
    # The same server package on a Red Hat Enterprise Linux 9 compatible system (AlmaLinux 9) in a virtual machine,
    # with SELinux enforcing and firewalld on, as on a real RHEL server: install, reach it from another computer
    # (this runner) through the firewall, restart, reboot, repair, roll back, firewall command, uninstall, install again.
    needs: linux-server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux-server.outputs.name }}
          path: pkg
      - name: Start an AlmaLinux 9 virtual machine (SELinux enforcing, firewalld on)
        run: |
          set -x
          sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          sudo chmod 666 /dev/kvm
          cd "$RUNNER_TEMP"
          IMG=AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
          curl -fsSLO "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/$IMG"
          curl -fsSL -o CHECKSUM https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/CHECKSUM
          want="$(grep -F "$IMG" CHECKSUM | grep -oE '[0-9a-f]{64}' | head -1)"
          test -n "$want" && echo "$want  $IMG" | sha256sum -c
          qemu-img resize "$IMG" 60G
          ssh-keygen -t ed25519 -N '' -f vmkey -q
          cat > user-data <<EOF
          #cloud-config
          users:
            - name: ci
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys: [$(cat vmkey.pub)]
          packages: [firewalld, policycoreutils-python-utils, audit, tar]
          runcmd:
            - [systemctl, enable, --now, firewalld]
          EOF
          cloud-localds seed.iso user-data
          qemu-system-x86_64 -enable-kvm -cpu host -m 8192 -smp 4 -daemonize -display none \
            -drive file="$IMG",if=virtio -drive file=seed.iso,if=virtio,format=raw \
            -netdev user,id=n0,hostfwd=tcp::2222-:22,hostfwd=tcp::8765-:8765 -device virtio-net-pci,netdev=n0
          for i in $(seq 90); do ssh -i vmkey -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 ci@127.0.0.1 true 2>/dev/null && break; sleep 5; done
          ssh -i vmkey -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ci@127.0.0.1 'cloud-init status --wait; cat /etc/redhat-release; getenforce; systemctl is-active firewalld; df -h /'
      - name: Try it on Red Hat (install, network through the firewall, restart, reboot, repair, rollback, uninstall, install again)
        run: |
          set -x
          cd "$RUNNER_TEMP"
          vm() { ssh -i vmkey -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 ci@127.0.0.1 "$@"; }
          up() { for i in $(seq 120); do curl -fsS -m 2 http://127.0.0.1:8765/api/health && return 0; sleep 1; done; vm 'sudo tail -40 /opt/lanepulse/logs/server.log; sudo journalctl -u lanepulse --no-pager | tail -20'; return 1; }
          down() { for i in $(seq 30); do curl -fsS -m 2 http://127.0.0.1:8765/api/health || return 0; sleep 1; done; return 1; }
          N="${{ needs.linux-server.outputs.name }}"
          test "$(vm getenforce)" = Enforcing
          scp -i vmkey -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$GITHUB_WORKSPACE/pkg/$N.tar.gz" ci@127.0.0.1:
          vm "tar -xzf $N.tar.gz && rm $N.tar.gz"
          vm "sudo ./$N/install-server.sh"          # default: open to the server's own network, through firewalld
          up
          vm 'sudo firewall-cmd --list-rich-rules' | grep 'port="8765"' >/dev/null
          vm 'ls -Z /opt/lanepulse/current/python/bin/python3.12' | grep bin_t >/dev/null
          vm 'lanepulse status'
          vm 'sudo lanepulse models'
          vm 'sudo lanepulse restart' && up
          vm 'sudo systemctl reboot' || true
          sleep 20
          for i in $(seq 60); do vm true 2>/dev/null && break; sleep 5; done
          up                                        # starts by itself at boot, under SELinux
          vm "sudo ./$N/install-server.sh --skip-check"   # repair: same version again
          up
          vm 'sudo lanepulse rollback' && up
          vm 'sudo lanepulse firewall' | grep 8765 >/dev/null
          if vm 'sudo ausearch -m AVC -ts boot 2>/dev/null || true' | grep -iE 'lanepulse|python'; then echo "SELinux denied LanePulse something"; exit 1; fi
          vm 'sudo /opt/lanepulse/uninstall-server.sh'
          down
          if vm 'sudo firewall-cmd --list-rich-rules' | grep 'port="8765"' >/dev/null; then echo "uninstall left the firewall rule"; exit 1; fi
          vm 'test -d /srv/lanepulse/data && test -d /srv/lanepulse/models && test ! -e /opt/lanepulse && test ! -e /usr/bin/lanepulse'
          vm "sudo ./$N/install-server.sh --allow-from any --skip-check"
          up
          vm 'sudo /opt/lanepulse/uninstall-server.sh'
