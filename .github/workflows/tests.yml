name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,probe]"
      - name: Fetch model pack (stands in for the staging machine)
        run: python scripts/fetch_models.py
      - run: python -m pytest -v
      - name: Hardware probe report (runner hardware, not the target workstation)
        run: python -m trafficwb.probe
