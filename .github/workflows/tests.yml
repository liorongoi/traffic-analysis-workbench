name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web screens
        run: python scripts/build_ui.py
      - run: python -m pip install -e ".[dev,probe,cpu]"
      - name: Fetch model pack (stands in for the staging machine)
        run: python scripts/fetch_models.py
      - run: python -m pytest -v
      - name: Hardware probe report (runner hardware, not the target workstation)
        run: python -m trafficwb.probe

  offline-bundle:
    # ENV-04: build the Windows offline bundle, then install it and run the install-to-export check
    # with package downloads turned off and web traffic sent to a dead proxy. "auto" carries both GPU
    # builds; on this runner (no NVIDIA driver) the installer must pick DirectML.
    strategy:
      fail-fast: false
      matrix:
        ort: [cpu, auto]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python scripts/build_ui.py
      - run: python scripts/fetch_models.py
      - run: python scripts/make_bundle.py --platform win_amd64 --python 3.12 --ort ${{ matrix.ort }} --out dist
      - name: Install offline and check
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          $b = Get-ChildItem dist -Directory | Select-Object -First 1
          $out = & "$($b.FullName)\install.ps1" -Target "$env:RUNNER_TEMP\twb" -Data "$env:RUNNER_TEMP\twbdata" -BackupDir "$env:RUNNER_TEMP\twbbk" *>&1 | Tee-Object -Variable log
          if ("${{ matrix.ort }}" -eq "auto" -and -not ($log -match "ONNX Runtime build: directml")) { throw "auto bundle did not choose DirectML on a runner without NVIDIA" }
          if (-not (Test-Path "$env:RUNNER_TEMP\twb\start.cmd")) { throw "start.cmd was not written" }
          Get-Content "$env:RUNNER_TEMP\twb\start.cmd"
      - name: Automatic start (sign-in default, restart, power-on task, remove)
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\twb"
          function Up { try { $wc = New-Object System.Net.WebClient; $wc.Proxy = $null; $null = $wc.DownloadString("http://127.0.0.1:8765/api/session"); $true } catch { $false } }
          function WaitFor([bool]$want) { for ($i = 0; $i -lt 60; $i++) { if ((Up) -eq $want) { return }; Start-Sleep 2 }; Get-Content "$t\logs\server.log" -ErrorAction SilentlyContinue; throw "server up=$want not reached" }
          # The installer set up start at sign-in and started the server (no administrator rights used).
          if (-not (Test-Path ([IO.Path]::Combine([Environment]::GetFolderPath("Startup"), "Traffic Analysis Workbench.lnk")))) { throw "sign-in start not set up" }
          WaitFor $true
          & "$t\autostart.ps1" -Mode status
          # restart: the server is stopped and comes back by itself
          & "$t\autostart.ps1" -Mode restart
          if (Up) { throw "server still answering right after restart" }
          WaitFor $true
          & "$t\autostart.ps1" -Mode remove
          WaitFor $false
          # power-on task (the runner has administrator rights)
          & "$t\autostart.ps1" -Mode boot -System
          WaitFor $true
          & "$t\autostart.ps1" -Mode status
          & "$t\autostart.ps1" -Mode remove
          WaitFor $false
          if (Get-ScheduledTask -TaskName "Traffic Analysis Workbench" -ErrorAction SilentlyContinue) { throw "task not removed" }
      - name: Speed check on the installed version
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\twb"
          if (-not (Test-Path "$t\speed-check.cmd")) { throw "speed-check.cmd was not written" }
          $venv = (Get-Content "$t\current.txt" -Raw).Trim()
          $env:TWB_MODELS = "$t\models"
          & "$venv\Scripts\trafficwb-speedcheck.exe" --n 3 --out "$t\logs\speed-check.txt"
          if ($LASTEXITCODE -ne 0) { throw "speed check failed" }
          Get-Content "$t\logs\speed-check.json"
